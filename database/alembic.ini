# Alembic configuration. Run from this directory:  cd database && alembic <cmd>
# or from repo root:  alembic -c database/alembic.ini <cmd>
# The database URL is NOT hardcoded here - env.py reads it from app settings
# (DATABASE_URL env var / .env), so there is a single source of truth.

[alembic]
script_location = .
prepend_sys_path = .
# sqlalchemy.url is intentionally blank; env.py overrides it from settings.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
