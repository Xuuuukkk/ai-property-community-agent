# Production Nginx configuration for AI Property Community Agent.
# Mount this file into the frontend container as /etc/nginx/conf.d/default.conf
# and place your SSL certificate + key under /etc/nginx/ssl/.

server {
    listen 80;
    server_name _;

    # Redirect all HTTP traffic to HTTPS in production.
    # If you are running a local demo without certificates, comment out
    # this block and uncomment the second server block below.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSL certificates (mount real certs in docker-compose.prod.yml).
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern TLS configuration.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Frontend SPA: serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service.
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: health check endpoint exposed directly.
    location /health {
        proxy_pass http://backend:8000/api/health;
    }
}

