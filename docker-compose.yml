# Phase 1 compose: backend + postgres(pgvector) + redis.
# The `frontend` service is intentionally omitted until Phase 4 (its Dockerfile
# does not exist yet) so that `docker compose up` works today.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: property-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: property_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-boot init scripts (e.g. CREATE EXTENSION vector)
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d property_agent"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: property-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    container_name: property-backend
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg2://admin:password@postgres:5432/property_agent
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./database:/app/database:ro
      - ./data/seed:/app/data/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
