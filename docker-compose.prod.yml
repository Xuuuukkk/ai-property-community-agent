# Docker Compose — Production
# Reads environment variables from the `.env` file in the project root.
# Copy `.env.example` to `.env`, fill in real values, and obtain SSL certificates
# before running this file.
#
# Quick start:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# For local demo without SSL certificates, see nginx/nginx.prod.conf comments.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: property-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: property-redis
    restart: unless-stopped
    networks:
      - property-network
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/xuuuukkk/ai-property-community-agent/backend:latest
    container_name: property-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_PREFIX: ${API_PREFIX:-/api}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-deterministic}
      HF_TOKEN: ${HF_TOKEN:-}
    # Backend is not exposed directly; traffic goes through the frontend/nginx gateway.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - property-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/xuuuukkk/ai-property-community-agent/frontend:latest
    container_name: property-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    volumes:
      # Production nginx config with SSL termination.
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount your real SSL certificate and private key here.
      - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - property-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # One-shot backup service. Run manually or schedule externally (e.g. cron).
  backup:
    image: pgvector/pgvector:pg16
    container_name: property-backup
    profiles:
      - backup
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
    command: >
      sh -c "pg_dump -h $${PGHOST} -U $${PGUSER} -d $${PGDATABASE} -Fc > /backups/property_agent_$$(date +%Y%m%d_%H%M%S).dump && echo 'Backup completed'"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - property-network

volumes:
  pgdata:
  redisdata:

networks:
  property-network:
    name: property-network
